<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="SiteTrack Pro - Construction site management with role-based access, RFI, change orders, GST billing, labour register and offline support." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <!-- Session 28.5 — A+C UI rebuild: Sora (display) + Inter (body) + JetBrains Mono (numbers).
         No serifs. Preconnect for fast first paint on the login screen. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    <title>SiteTrack Pro</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service worker REMOVED — the old cache-first SW served a stale app shell
      // + JS chunks after every deploy, causing infinite "Loading…" hangs.
      // Proactively unregister ANY previously-installed SW and clear its caches
      // so returning visitors immediately get fresh code. public/sw.js is now a
      // self-destruct stub that does the same for tabs still under the old SW.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then((rs) => rs.forEach((r) => r.unregister()))
          .catch(() => {});
      }
      if (window.caches && caches.keys) {
        caches.keys().then((keys) => keys.forEach((k) => caches.delete(k))).catch(() => {});
      }
    </script>
  </body>
</html>
