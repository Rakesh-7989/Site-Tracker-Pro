name: CI

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Stray-artifact guard: fail the build if known do-not-commit artifacts
      # (captured CLI stderr dumps, temp probe/apply runners, scratch files)
      # ever get committed again. Keeps the tree clean like the AGENTS.md
      # "Do-not-commit artifacts" list.
      - name: Stray-artifact guard
        run: |
          stray="$(git ls-files | grep -Ei '(^|/)(migration_status\.txt|test-output\.txt|e2eout\.txt|error\.txt|tmp\.txt|tsout[^/]*\.txt)$' || true)"
          stray="$stray
          $(git ls-files | grep -Ei 'scripts/(apply-(173|174|175|183|195|201)\.mjs|probe-(199|202)\.mjs|verify-(183|184|195)\.mjs|scan-card-headers\.mjs)$' || true)"
          if [ -n "$(printf '%s' "$stray" | tr -d '[:space:]')" ]; then
            echo "::error::Stray do-not-commit artifacts present in the tree:"
            printf '%s\n' "$stray"
            exit 1
          fi
          echo "No stray do-not-commit artifacts."
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run smoke
      # Column-drift gate: the scanner prints SKIP and exits 0 when the
      # SUPABASE_DB_URL env var is empty (secret not set), so a missing secret
      # never blocks a deploy. Add it to repo Settings → Secrets → Actions →
      # SUPABASE_DB_URL to activate the gate.
      - name: Column-drift gate
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run check:columns
      # DB-types freshness gate (P1-C): src/lib/database.types.ts must mirror
      # the live public schema. Same SKIP-when-secret-missing contract.
      - name: DB-types freshness gate
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run db:types -- --check
      # SECURITY DEFINER search-path gate (audit P0): every non-extension
      # definer function must pin search_path. SKIPs cleanly when the secret
      # is missing, same contract as the column-drift gate above.
      - name: Security-definer gate
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run check:definer -- --strict
      # RLS security proofs (SEC-02): run against the live DB inside
      # rolled-back transactions. Skip cleanly when the secret is missing.
      - name: RLS security tests
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run test:rls && npm run test:rls:project && npm run test:rls:teams && npm run test:rls:versions && npm run test:rls:finance && npm run test:rls:partners && npm run check:rls:coverage
      - run: npm run test:unit
      - name: V2 app gates (typecheck + lint + test + build)
        run: |
          cd v2
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm test
          npm run build

  # The CI-runnable mocked role-access suite (real router + shell, mocked
  # Supabase session/REST). Runs in parallel with the unit gate.
  e2e-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Run mocked role-access suite
        run: npm run test:e2e:mock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-mock-report
          path: test-results/
          retention-days: 7

  # Coverage on the logic layers (src/app, src/auth, src/lib, src/modules,
  # src/plugins). Thresholds = measured baseline (2026-08-10) — green today,
  # fails if coverage drops.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:unit:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
