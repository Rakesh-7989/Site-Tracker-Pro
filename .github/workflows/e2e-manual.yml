name: "E2E — Manual Trigger"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Test target (local = dev server, production = live URL)"
        required: true
        default: production
        type: choice
        options:
          - production
          - local
      browsers:
        description: "Browser filter (empty = desktop + Mobile Safari)"
        required: false
        default: ""
        type: string

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers (CI needs headless shell separately)
        run: >
          npx playwright install chromium chromium-headless-shell firefox webkit 2>&1
          && npx playwright install-deps webkit 2>&1
      - name: Run E2E tests (production)
        if: inputs.target == 'production'
        run: >
          npx playwright test --config=playwright.config.ts
          ${{ inputs.browsers != '' && format('--project={0}', inputs.browsers) || '--project=chromium --project=firefox --project=webkit --project="Mobile Safari"' }}
      - name: Run E2E tests (local dev server)
        if: inputs.target == 'local'
        run: >
          npx playwright test --config=playwright.config.js
          ${{ inputs.browsers != '' && format('--project={0}', inputs.browsers) || '--project=chromium --project=firefox --project=webkit --project="Mobile Safari"' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
