name: "E2E — Manual Trigger"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Test target (local = dev server, production = live URL)"
        required: true
        default: production
        type: choice
        options:
          - production
          - local
      browsers:
        description: "Browser filter (empty = all)"
        required: false
        default: ""
        type: string

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: |
          npx playwright install --with-deps chromium 2>&1
          npx playwright install --with-deps firefox 2>&1
          npx playwright install --with-deps webkit 2>&1
      - name: Run E2E tests (production)
        if: inputs.target == 'production'
        run: npx playwright test --config=playwright.config.ts ${{ inputs.browsers != '' && format('--project={0}', inputs.browsers) || '' }}
        env:
          HOME: /root
      - name: Run E2E tests (local dev server)
        if: inputs.target == 'local'
        run: npx playwright test --config=playwright.config.js ${{ inputs.browsers != '' && format('--project={0}', inputs.browsers) || '' }}
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
